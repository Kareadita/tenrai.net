name: Release

on:
  push:
    branches: ["master"]

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  run-release-tool:
    if: github.repository == 'Kareadita/tenrai.net'
    uses: Kareadita/GitHubActions/.github/workflows/release-tools.base.yml@main
    secrets:
      NUGET_USER: ${{ secrets.NUGET_USER }}
    with:
      config-path: release.yml
